  <style id="boot-splash-css">
    #boot-splash{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#030712;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;text-align:center;transition:opacity calc(.28s * var(--boot-speed,1)) ease}
    html:has(#boot-splash){overflow:hidden}
    #boot-splash.is-leaving{opacity:0;pointer-events:none}
    #boot-splash .boot-inner{animation:bootIn calc(.42s * var(--boot-speed,1)) ease-out both}
    #boot-splash img{width:72px;height:72px;object-fit:contain;animation:bootPulse calc(1.8s * var(--boot-speed,1)) ease-in-out infinite}
    #boot-splash h1{margin:14px 0 4px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
    #boot-splash p{margin:0;color:#94a3b8;font-size:.85rem}
    #boot-splash .dots{display:flex;justify-content:center;gap:7px;margin-top:18px}
    #boot-splash .dots span{width:7px;height:7px;border-radius:50%;background:#7c3aed;animation:bootDot calc(1s * var(--boot-speed,1)) ease-in-out infinite}
    #boot-splash .dots span:nth-child(2){animation-delay:.15s}#boot-splash .dots span:nth-child(3){animation-delay:.3s}
    @keyframes bootIn{from{opacity:0;transform:translate3d(0,10px,0) scale(.98)}to{opacity:1;transform:none}}
    @keyframes bootPulse{50%{opacity:.6;transform:scale(1.05)}}
    @keyframes bootDot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){#boot-splash .boot-inner,#boot-splash img,#boot-splash .dots span{animation:none}}
  </style>

<body>
  <div id="boot-splash" role="status" aria-label="Loading SavePoint"><div class="boot-inner"><img src="icons/controller.svg" alt=""><h1>SavePoint</h1><p>Loading your collection</p><div class="dots" aria-hidden="true"><span></span><span></span><span></span></div></div></div>
  <script>
    (function () {
      var mult = 1, off = false;
      try {
        var prefs = (JSON.parse(localStorage.getItem("splitapp_savepoint_v1") || "{}").preferences) || {};
        mult = { off: .001, fast: .5, normal: 1, slow: 1.75 }[prefs.animationSpeed] || 1;
        off = prefs.reduceMotion === true || prefs.animationSpeed === "off";
      } catch (e) {}
      var splash = document.getElementById("boot-splash");
      splash.style.setProperty("--boot-speed", String(mult));
      var start = Date.now(), minMs = off ? 0 : 1200 * mult, done = false;
      window.SavePointSplash = { ready: function () {
        if (done) return; done = true;
        setTimeout(function () {
          splash.classList.add("is-leaving");
          setTimeout(function () { splash.remove(); document.getElementById("boot-splash-css")?.remove(); }, 320 * mult + 40);
        }, Math.max(0, minMs - (Date.now() - start)));
      } };
      setTimeout(function () { window.SavePointSplash.ready(); }, 6000);
    })();
  </script>

      </div>
    </header>
    <main id="page-content" tabindex="-1"></main>
    <nav class="bottom-bar" id="bottom-bar" aria-label="Main navigation">

    </div>

  <dialog id="setting-picker-dialog" class="choice-dialog" aria-labelledby="setting-picker-title"><div class="choice-dialog-grabber" aria-hidden="true"></div><header class="choice-dialog-header"><h2 id="setting-picker-title" data-setting-picker-title>Choose an option</h2><button type="button" class="choice-dialog-close" data-close-setting-picker aria-label="Close">×</button></header><div class="setting-picker-list" data-setting-picker-list></div></dialog>

  <section class="storage-folder-gate" id="storage-folder-gate" hidden role="dialog" aria-modal="true" aria-labelledby="storage-folder-gate-title">

      <span class="storage-folder-gate-icon" aria-hidden="true">▣</span>

      <button type="button" class="button primary" id="storage-folder-gate-retry">Choose folder</button>
    </div>
